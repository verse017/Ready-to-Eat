server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 15M;

    # 1. FRONTEND: Serve compiled React production build
    root /var/www/app/frontend/build;
    index index.html;

    # SPA routing fallback: prevents 404 when navigating or refreshing routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Reverse proxy all /api requests to Express on port 5000 cleanly
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. STATIC CACHING: Speeds up CSS, JS, fonts, and images
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
